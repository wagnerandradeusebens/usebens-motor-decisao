<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <img
        class="shell__logo"
        src="brand/logo-nexo-horizontal-branco.svg"
        alt="usebens nexo"
      />
    </div>

    <mat-nav-list class="shell__nav">
      @for (item of nav; track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="shell__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="shell__foot">Nexo · motor de decisão de crédito</div>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="shell__toolbar">
      <span>Nexo</span>
    </mat-toolbar>

    <div class="shell__page">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
